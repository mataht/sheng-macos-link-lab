[[area]]
id = "display"
status = "device-verified"
components = []
paths = ["platform/sheng/macos26/display/**", "platform/sheng/macos26/recovery/**", "config/macos26-recovery-ui-pages.json", "config/macos26-full-ui-pages.json"]
inputs = ["Framebuffer left by the bootloader, 3048 x 2032 BGRA; panel size 262 x 175 mm; no GPU driver in use."]
configuration = ["NativeGOPDisplay presents the framebuffer as an IOMobileFramebuffer (native-gop-display=1). WindowServer is switched to CPU compositing and BGRA output by in-memory edits of a few pages of the shared cache, each checked by original bytes and page hash (sheng-full-ui=1). A software cursor is forced; sleep is disabled."]
procedure = ["Boot with native-gop-display=1 sheng-full-ui=1; optional native-gop-diag=1 draws a counter strip at the top left."]
findings = ["The desktop shows wallpaper, widgets and windows; taps register.", "Each swap copies only the rows that changed, which fixed stale rows.", "The log panel no longer scrolls by reading the framebuffer, which brought the boot to the desktop from about five minutes to about two.", "The pointer appears about 30 seconds after a tap although the driver has already updated the coordinates, so WindowServer submits roughly one frame per 15 seconds or more. The cause is not established."]
completion = ["The first frame is presented, the desktop is drawn and the pointer follows the finger."]
limits = ["No GPU rendering, no backlight control, and the interface is too slow for normal use."]
next_action = ["Find out why WindowServer composes so slowly (full-screen blur on the CPU, the forced software cursor, or a wait) and fix it before GPU work depends on it."]

