[[area]]
id = "packaging"
status = "host-verified"
components = []
paths = ["scripts/package_macos26_ufs.py", "scripts/assemble_*.py", "scripts/qualification_reuse.py", "tests/**"]
inputs = ["CI outputs, the paired Apple kernel extensions (local only), a device tree generated from board facts, driver switches, and the evidence from QEMU runs and device steps."]
configuration = ["The packager refuses a package unless its evidence matches: same kernel identity, QEMU observations, root install evidence and, for full-system packages, a sibling VirtIO build of the same kernel. A tiered policy decides whether earlier long-run evidence can be reused, by comparing build records."]
procedure = ["Assemble the kernel twice and compare byte for byte; run the quick QEMU gates (root found, storage default off, memory layout, eight cores); package; verify the package with an independent script that compares container, kernel, device tree and boot arguments."]
findings = ["Assembly outputs and packages contain Apple code and vendor firmware and stay local; the repository holds the tools and tests.", "Reusing evidence is decided by comparing build records, not by hand.", "The second integrated kernel has no complete full-system QEMU run: one run ended in a tool failure at the last read and one in the known intermittent opendirectoryd panic on /Search. Its three tablet packages (stage 9, Metal plug-in, RTC) were booted under user waivers of that one gate, each valid for one package only; the other checks were not relaxed.", "The packager's sibling qualification does not reject a QEMU run that ended in a panic. Known gap, not yet fixed."]
completion = ["Every package passes the independent review before any boot is requested."]
limits = ["The local assembly and review outputs are not published, so a third party cannot rerun the review without their own inputs. A complete full-system QEMU run of the second integrated kernel is still missing."]
next_action = ["Document the packager's evidence rules in docs/ so another unit can reuse them."]

