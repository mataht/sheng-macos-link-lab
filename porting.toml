[[area]]
id = "storage"
status = "device-verified"
components = []
paths = ["platform/sheng/macos26/storage/**", "scripts/package_macos26_ufs.py", "scripts/native_log_file.py", "scripts/repartition_*.py", "scripts/install_macos26_*.py"]
inputs = ["UFS controller with several LUNs; a new partition for macOS on LUN0; a small log partition; a system image supplied by the user (this repository neither contains nor documents how it is made)."]
configuration = ["NativeUfs is a read-only driver that publishes only registered partition windows after checking the SHNGROOT header (size and SHA-256); writes are off by default. The system volume is selected by volume UUID with -nobsdmgroot; writes go to a volatile RAM overlay (boot argument native-ufs-root-overlay-mib)."]
procedure = ["Create the partition and write the image only with the device owner's approval for each step; the packager refuses a package without matching install evidence. Boot with `fastboot boot`."]
findings = ["The tablet reads its macOS partition through NativeUfs and runs the full system on it; persistent writes are implemented but disabled.", "Reading is slower than it needs to be; the read path is deliberately simple."]
completion = ["The root volume mounts, the data volume mounts, and the system runs without disk writes."]
limits = ["Persistent writes are not verified on the tablet. The UFS driver cannot be exercised in QEMU, so full-system QEMU evidence comes from a VirtIO build of the same kernel with only the storage driver replaced."]
next_action = ["Enable and verify persistent writes with a separate approval; improve read throughput."]

