[[area]]
id = "gpu"
status = "implemented"
components = []
paths = ["platform/sheng/macos26/gpu/**", "patches/Adreno740/**", "patches/UniXNU-sheng-gpu/**", "config/turnip-sources.json", "config/metal-bridge-sources.json", "config/metal-plugin-sources.json"]
inputs = ["Adreno 740 (a7xx) with its GMU, SMMU and firmware (firmware is read from a device tree node and is never stored here); UniXNU's Adreno740 component; Mesa's Turnip driver with a Darwin backend; a Rust Metal-to-Vulkan bridge; a Metal plug-in loaded by WindowServer."]
configuration = ["Kernel: an IOAccelerator front end over UniXNU's Adreno kernel stack, 16 KiB pages, default off, sheng-gpu-power=1..9 (1 is read-only). User space: plug-in bundle (Metal front end, bridge, Turnip) delivered as a compressed device tree node in QEMU."]
procedure = ["Build with the --build-gpu switch (kernel) and the gpu-userland workflow (plug-in); boot with sheng-gpu-power=1 for the read-only stage. Higher stages power the GPU and need the device owner's approval."]
findings = ["QEMU stage A: WindowServer loaded the plug-in, called its initialisation, opened the accelerator and the runtime answered that no device exists (QEMU has no A740).", "QEMU stage B (fake A740 that executes nothing): Turnip created a device, two submissions, the first frame (800 x 600, no content); WindowServer then exited with SIGABRT intermittently, cause unknown.", "Tablet, stages 3 to 8: power domains, clocks, the GMU SMMU context and the GMU firmware came up one stage per boot, ending with GX powered by the GMU and a heartbeat that advances; no fault, no panic.", "Tablet, stage 9, first kernel: the secure calls to TrustZone (zap load and authentication, SMMU aperture) all returned 0 and the GPU executed its first command through its own SMMU context; then the kernel panicked because the board probe called ml_io_unmap with a 4 KiB length on a 16 KiB-page kernel. Fixed by releasing whole pages (ioUnmapPages).", "Tablet, stage 9, second integrated kernel: desktop reached without a panic; the first GPU interrupt arrived, the accelerator was published, and all 1023 dwords of the test copy were correct.", "Tablet, first Metal plug-in boot (sheng-gpu-metal=1, sheng-full-ui=2): the plug-in was installed, the accelerator registered, WindowServer created the device named Turnip Adreno (TM) 740 and 107 client calls reached the driver with no fault and no panic, but the whole screen stayed black with no pointer. The driver was copying frames (0 to 6 swaps per second, then 0 or 1 after about 170 seconds). The cause is not established; candidates in order of likelihood: the display copy reads stale zeros because nothing invalidates the CPU cache after the GPU writes DRAM; composition work is not submitted or produces nothing; tiled or compressed output.", "The plug-in contains metal2vulkan (GPL-2.0-or-later or LGPL-3.0-or-later); its build artifacts are not redistributed."]
completion = ["WindowServer renders through the Adreno 740 with Metal; AIR shaders compile to Adreno code."]
limits = ["Nothing has been rendered by the GPU onto the screen. There is no evidence yet that Turnip compiled a shader or that the GPU executed real composition work. The second integrated kernel, on which stage 9 and the plug-in boot ran, has no complete full-system QEMU run (see the packaging area). Video readings of the rows have a few ambiguous characters (0 and 8 look alike)."]
next_action = ["One diagnostic build and one boot: count client submissions per second, completed fences, SMMU fault bits and non-zero pixels of the presented surface through the cached mapping and through a fresh uncached mapping. Zero cached and non-zero uncached means invalidate before the copy; zero in both with submissions means a rendering problem; no submissions means the plug-in or WindowServer side. Not started. Also explain the intermittent WindowServer abort after the first frame in QEMU."]

