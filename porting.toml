[[area]]
id = "network"
status = "implemented"
components = []
paths = ["platform/sheng/macos26/net/**", "scripts/native_wifi.py"]
inputs = ["Wi-Fi and Bluetooth chip (WCN7850 family) on PCIe0 with its power rails, the sleep-clock pin and the MHI interface; vendor firmware is never stored here."]
configuration = ["NativeWifi, default off: sheng-wifi=1 read-only snapshot, 2 power and PCIe link with endpoint identification, 3 BAR0 and MHI registers. The class is an Ethernet-style controller from IONetworkingFamily. RPMh TCS 0 is used."]
procedure = ["Boot with sheng-wifi=N for stage N; stages 2 and 3 power the chip and need approval for each boot."]
findings = ["Stage 1 on the tablet: the PCIe0 power domain is collapsed with no clock votes; WLAN_EN, BT_EN and PERST# read low; two of the chip's rails read off and three on at the pinned voltages; the sleep-clock pin is idle and owned by another execution environment."]
completion = ["The endpoint enumerates, firmware loads, a network interface is published and packets flow."]
limits = ["Stages 2 and 3 have not run on the tablet. There is no firmware loading, no network interface and no DMA. Bluetooth has only had its pin and clock read; the macOS-side HCI path is undecided."]
next_action = ["Run stage 2 on the same kernel with approval, then decide the firmware and MHI work."]

