[[area]]
id = "memory"
status = "device-verified"
components = []
paths = ["patches/UniXNU-sheng/0009-adt-13gib-owned-memory.patch", "platform/sheng/macos26/power/native_memperf.cpp"]
inputs = ["Two DRAM windows (0x80000000 to 0xFFFFFFFF and 0x880000000 to 0xBFFFFFFFF) on the 16 GB unit; macOS uses 16 KiB pages."]
configuration = ["Memory map patch for the CN 16 GB unit in the UniXNU-sheng series (0009); 16 KiB page size in the kernel and the Adreno code; sheng-memperf=1 enables the read-only L3/RPMh report."]
procedure = ["Boot the packaged kernel; the packager checks the memory map against the unit's layout."]
findings = ["The full system runs with the 16 KiB-page kernel and this memory map.", "The NativeMemPerf first stage read the RPMh command database with status 0; no benchmark has been run.", "The first report's Device and write-combined columns measured cached memory, because a second mapping of the kernel buffer returned the cached address; the code now maps the physical address (fixed, not yet run on the tablet)."]
completion = ["All handoff regions are accounted for and each DMA engine uses its allocated range with the documented cache policy."]
limits = ["Memory bandwidth and cache-policy performance are not measured. The framebuffer is mapped as device memory, which makes scrolling text slow; the log panel avoids reading it back."]
next_action = ["Run the memory benchmark stage and compare cached, device and write-combined mappings."]

