[[area]]
id = "power"
status = "implemented"
components = []
paths = ["platform/sheng/macos26/power/**", "platform/sheng/macos26/adsp/**"]
inputs = ["PMIC state (RTC, backlight drivers KTZ8866 x 2), ADSP-owned battery and charger services, RPMh, the performance and memory-latency state."]
configuration = ["Default-off drivers: NativeRtc (sheng-rtc), NativeBacklight (sheng-backlight, always clamped to 64..2047), NativeMemPerf (sheng-memperf), NativeAdsp and NativeBattery (sheng-adsp, sheng-battery), a PSCI reset hook (sheng-psci-reset). Charger writes are off and the critical battery level is never asserted."]
procedure = ["Boot with sheng-<driver>=1 for the read-only snapshot; later stages need approval."]
findings = ["The first stage of each ran on the tablet without writes. XNU waits up to 30 seconds for an IORTC service at boot. With sheng-rtc=2 the platform expert publishes IORTC early and NativeRtc moves the calendar forward; on the tablet this saved about 30 seconds (WindowServer's screen about 49 seconds after the boot command against 75 to 81 seconds before; read by hand from a video at 3 second steps). The calendar starts at the packaging time, not the true time. The ADSP firmware owns the Type-C controller.", "System sleep panics in QEMU because the platform does not register its cores for sleep, so sleep is disabled."]
completion = ["Battery state and charging reported to macOS; brightness control; time kept across boots; sleep."]
limits = ["No battery reporting, no brightness control, no true time (the calendar starts at the packaging time; the RTC counter probably clears on a forced reset, so an offset taken from Android is not usable), no sleep."]
next_action = ["Measure the memory-bandwidth stage; decide the first ADSP stage that starts the DSP."]

