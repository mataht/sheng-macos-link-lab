[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["patches/uefi-sheng/**", "patches/UniXNU-sheng/**", "patches/ShengPreflight/**", "patches/VerifiedRoot/**", "scripts/build_firmware.py", "ci/preflight.dsc"]
inputs = ["uefi-sheng and UniXNU-sheng at the commits pinned in sources.lock.json, plus this repository's patch series; the vendor firmware archive named by the pinned UniXNU-sheng, which is downloaded on the build machine and not stored here."]
configuration = ["Boot image: Android boot container with the UEFI firmware and a FAT payload volume holding the UniXNU configuration, the kernel, the device tree and the trust cache; the loader is DarwinBoot. Boot arguments (cpus=8, driver stages) come from the packager."]
procedure = ["Build the firmware with scripts/build_firmware.py, package the kernel and device tree with scripts/package_macos26_ufs.py, then run `fastboot boot` once with the device owner's approval. Nothing is flashed; a restart returns to Android."]
findings = ["The bootloader of the CN OS3.0.306 unit accepts the self-built container and the firmware shows the UniXNU menu (first seen 2026-11-06).", "The bootloader leaves the display lit and a framebuffer in memory, which the kernel display driver reuses."]
completion = ["The firmware reaches the UniXNU menu, DarwinBoot loads the kernel with the 16 GB memory map, and the framebuffer and reservations are preserved."]
limits = ["Only the CN OS3.0.306 unit has been tested. Other vendor firmware versions are untested."]
next_action = ["None until a second unit with a different firmware version is available."]

