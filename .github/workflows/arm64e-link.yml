name: ARM64E Apple linker comparison
on:
  workflow_dispatch:
  push:
    branches: [main, 'ci/**']
    paths: ['inputs/**', 'scripts/**', 'tests/**', '.github/workflows/arm64e-link.yml']
permissions:
  contents: read
concurrency:
  group: arm64e-link-${{ github.ref }}
  cancel-in-progress: false
jobs:
  link:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check symbol rewrite boundaries
        run: python3 -m unittest discover -s tests -v
      - name: Verify inputs and link original and combined drivers
        run: python3 scripts/link_probe.py --artifact inputs/driver-objects-a200d204.zip --output out
      - name: Save link results and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm64e-link-${{ github.run_id }}
          path: |
            out/*.json
            out/*.txt
            out/*.macho
          if-no-files-found: warn
          retention-days: 3
