name: GPU userland build
# Builds Turnip for macOS arm64e from pinned public sources: Mesa, UniXNU's recorded Mesa patches, Adreno740's ABI header and our 16 KiB
# page patch. Compile and link only. Nothing here contains Apple content or vendor firmware, and no job touches a device.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpu-userland-${{ github.ref }}
  cancel-in-progress: false
jobs:
  turnip:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Disabled until this workflow encrypts its artifacts
        run: |
          echo "Disabled: the artifacts of this workflow contain GPL-licensed code. See docs/ci.md."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Record toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun clang --version
          test "$(xcrun --sdk macosx --show-sdk-version)" = 27.0
          git rev-parse HEAD
      - run: python3 -m unittest discover -s tests -p "test_turnip_macos.py" -v
      - run: python3 scripts/sources.py fetch --lock config/turnip-sources.json --group graphics
      - name: Install the build tools
        run: |
          brew install ninja bison glslang
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          python3 -m pip install meson==1.9.1 Mako==1.3.10 MarkupSafe==3.0.4 packaging==25.0 PyYAML==6.0.3 ply==3.11
      - run: python3 scripts/build_turnip_macos.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: gpu-userland-turnip-${{ github.run_id }}
          path: |
            out/turnip-macos/build.json
            out/turnip-macos/libvulkan_freedreno.dylib
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gpu-userland-diagnostics-${{ github.run_id }}
          path: |
            out/turnip-macos/logs/
            out/turnip-macos/arm64e-macos.cross
            out/turnip-macos/build/meson-logs/
          if-no-files-found: warn
          retention-days: 7
  metal-bridge:
    # The Rust bridge from pinned public sources: AdrenoMetal and metal2vulkan with AdrenoMetal's recorded patches, for arm64e with clang's
    # pointer authentication ABI. Compile and link only.
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - name: Disabled until this workflow encrypts its artifacts
        run: |
          echo "Disabled: the artifacts of this workflow contain GPL-licensed code. See docs/ci.md."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Record toolchain
        run: |
          sw_vers
          uname -m
          sysctl -n hw.ncpu hw.memsize
          xcodebuild -version
          xcrun clang --version
          test "$(xcrun --sdk macosx --show-sdk-version)" = 27.0
          git rev-parse HEAD
      - run: python3 -m unittest discover -s tests -p "test_metal_bridge_macos.py" -v
      - run: python3 scripts/sources.py fetch --lock config/metal-bridge-sources.json --group graphics
      - name: Install Rust and llvm-as
        run: |
          brew install rustup llvm
          rustup_bin="$(brew --prefix rustup)/bin"
          echo "$rustup_bin" >> "$GITHUB_PATH"
          "$rustup_bin/rustup" toolchain install nightly-2026-11-03 --profile minimal --component rust-src
          "$rustup_bin/rustup" run nightly-2026-11-03 rustc -Vv
      - run: python3 scripts/build_metal_bridge_macos.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gpu-userland-metal-bridge-${{ github.run_id }}
          path: |
            out/metal-bridge/build.json
            out/metal-bridge/libadreno_metal_bridge.a
            out/metal-bridge/licenses/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gpu-userland-metal-bridge-diagnostics-${{ github.run_id }}
          path: |
            out/metal-bridge/logs/
            out/metal-bridge/Cargo.toml
            out/metal-bridge/Cargo.lock
            out/metal-bridge/arm64e-apple-darwin.json
            out/metal-bridge/rustc-builtin-target.json
          if-no-files-found: warn
          retention-days: 7
  metal-plugin:
    # The bundle: DroidVM's plugin class and AdrenoMetal's frontend linked with the bridge, and Turnip beside it. Link only; the artifact is for testing, not a release.
    needs: [turnip, metal-bridge]
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Disabled until this workflow encrypts its artifacts
        run: |
          echo "Disabled: the artifacts of this workflow contain GPL-licensed code. See docs/ci.md."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun clang --version
          test "$(xcrun --sdk macosx --show-sdk-version)" = 27.0
          git rev-parse HEAD
      - run: python3 -m unittest discover -s tests -p "test_metal_plugin_macos.py" -v
      - run: python3 scripts/sources.py fetch --lock config/metal-plugin-sources.json --group graphics
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gpu-userland-turnip-${{ github.run_id }}
          path: out/turnip-macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gpu-userland-metal-bridge-${{ github.run_id }}
          path: out/metal-bridge
      - run: python3 scripts/build_metal_plugin_macos.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: gpu-userland-metal-plugin-${{ github.run_id }}
          path: |
            out/metal-plugin/build.json
            out/metal-plugin/NativeAdrenoMetal.bundle/
            out/metal-bridge/licenses/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gpu-userland-metal-plugin-diagnostics-${{ github.run_id }}
          path: out/metal-plugin/logs/
          if-no-files-found: warn
          retention-days: 7
